# Optional local infrastructure for demo/prod parity. Not needed for the Phase 0 DoD:
# the whole suite runs on SQLite with no services. Start with:  docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: brandwatch
      POSTGRES_PASSWORD: brandwatch
      POSTGRES_DB: brandwatch
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
