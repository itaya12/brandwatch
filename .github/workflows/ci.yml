name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  DEMO_MODE: "true" # every provider resolves to its mock: the suite costs $0 and needs no keys
  SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,browser]"
      - name: Install Chromium for the sandboxed-fetcher test
        run: python -m playwright install --with-deps chromium
      - name: Migrate a scratch SQLite database
        run: alembic -x url=sqlite:///./ci.db upgrade head
      - run: pytest -q

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brandwatch
          POSTGRES_PASSWORD: brandwatch
          POSTGRES_DB: brandwatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brandwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://brandwatch:brandwatch@localhost:5432/brandwatch_test
      DATABASE_URL: postgresql+psycopg://brandwatch:brandwatch@localhost:5432/brandwatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Migrate up and down on PostgreSQL
        run: |
          alembic upgrade head
          alembic downgrade base
      - run: pytest -q
