{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="panel" style="max-width:720px;margin:40px auto;text-align:center">
  <div class="mono muted small" style="letter-spacing:.14em">ERROR {{ status_code }}</div>
  <h1 style="margin:8px 0 6px">{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <div class="actions" style="justify-content:center;margin-top:16px">
    <a class="btn" href="javascript:history.back()">← Back</a>
    {% if user %}<a class="btn" href="/ui/findings">Findings</a><a class="btn" href="/ui/dashboard">Dashboard</a>
    {% else %}<a class="btn" href="/ui/login">Sign in</a>{% endif %}
  </div>
</div>
{% endblock %}
