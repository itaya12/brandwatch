[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "brandwatch"
version = "0.0.1"
description = "BrandWatch — Phishing Domain Intelligence & Campaign Discovery (Phase 0 foundation)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - all rights reserved" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "dnspython>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "cryptography>=42",
    "arq>=0.26",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "dnstwist>=20240812",
    "python-whois>=0.9",
    "beautifulsoup4>=4.12",
    "pillow>=10.3",
    "numpy>=1.26",
    "mmh3>=4.1",
    "rapidfuzz>=3.9",
    "tldextract>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "respx>=0.21",
]
browser = ["playwright>=1.45"]

[tool.hatch.build.targets.wheel]
packages = ["src/brandwatch"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # the tests import shared helpers as tests.<module>, under plain `pytest` too
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:brandwatch.*"]
